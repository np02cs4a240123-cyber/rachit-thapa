<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Portfolio</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header>
<h1>My Portfolio</h1>
<nav>
<ul>
<li><a href="#about">About</a></li>
<li><a href="#projects">Projects</a></li>
<li><a href="#contact">Contact</a></li>
</ul>
</nav>
</header>


<main>
<section id="about">
<h2>About Me</h2>
<p>Hello! I am a beginner web developer learning how to build my first portfolio using HTML, CSS, and Git.</p>
</section>


<section id="projects">
<h2>My Projects</h2>
<div class="project">
<img src="images/screenshot.png" alt="Project Screenshot">
<p>This is my first HTML and CSS project — building a personal portfolio website!</p>
</div>
</section>


<section id="contact">
<h2>Contact Me</h2>
<form>
<label for="name">Name:</label>
<input type="text" id="name" name="name" required>


<label for="email">Email:</label>
<input type="email" id="email" name="email" required>


<label for="message">Message:</label>
<textarea id="message" name="message" required></textarea>


<button type="submit">Submit</button>
</form>
</section>
</main>
